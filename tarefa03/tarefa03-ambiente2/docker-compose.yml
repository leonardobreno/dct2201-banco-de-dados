
name: tarefa03_ambiente2

services:
  mariadb:
    image: mariadb:11
    container_name: lab-mariadb-2
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?defina MARIADB_ROOT_PASSWORD no arquivo .env}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-labdb2}
    ports:
      - "${MARIADB_PORT:-3308}:3306"
    volumes:
      - mariadb_data_2:/var/lib/mysql

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: lab-cloudbeaver-2
    ports:
      - "${CLOUDBEAVER_PORT:-8979}:8978"
    depends_on:
      - mariadb

volumes:
  mariadb_data_2:
